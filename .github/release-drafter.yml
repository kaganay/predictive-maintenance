name-template: 'v$NEXT_PATCH_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['bug', 'fix']
  - title: '🧰 Maintenance'
    labels: ['chore', 'deps', 'refactor', 'docs']

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

exclude-labels:
  - 'skip-changelog'

template: |
  ## Changes

  $CHANGES
