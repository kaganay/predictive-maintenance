name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PredictiveMaintenance.sln

      - name: Build
        run: dotnet build PredictiveMaintenance.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish src/Presentation/AygazPredictiveMaintenance.API/PredictiveMaintenance.API.csproj -c Release -o ./publish/api --no-build

      - name: Publish Web
        run: dotnet publish src/Presentation/AygazPredictiveMaintenance.Web/PredictiveMaintenance.Web.csproj -c Release -o ./publish/web --no-build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: predictive-maintenance-${{ github.ref_name }}
          path: |
            publish/api
            publish/web

  docker:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/predictive-maintenance-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/predictive-maintenance-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/predictive-maintenance-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/predictive-maintenance-web:latest

  create-release:
    runs-on: ubuntu-latest
    needs: [build-release]
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
